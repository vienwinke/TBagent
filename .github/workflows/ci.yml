name: CI

# 为什么要有它：本仓库的三道门禁（密钥扫描 / 越权红线 / 回归测试）在 2026-10 之前
# 全靠手动执行 —— 结果是 scripts/prepublish_check.py 存在了两周都没人跑，
# 期间一把真实密钥被提交进 .env.example 并推上远端历史。
# 门禁只有挂在流程上才算门禁；本地钩子（.githooks）还需要每个克隆手动配置，CI 不需要。

on:
  push:
  pull_request:

jobs:
  gates:
    name: 门禁（离线可跑，无需 Key / 无需 MySQL）· py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 本地开发环境是 Python 3.14（见 docs/开发环境.md），而 CI 过去只测 3.12 ——
        # 加上依赖未锁版本，"本地绿 / CI 绿 / 换台机器崩"三者可以同时成立。
        # 两版都测，把差异暴露在 CI 而不是部署当天。
        python-version: ["3.12", "3.14"]
    env:
      # 公开演示快照 data/snapshot.sqlite 随仓库分发，CI 不需要起 MySQL
      DB_BACKEND: sqlite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 代码质量（E9 语法类 + F pyflakes：未定义名/未用导入/重复定义）
        run: python -m ruff check .

      - name: 依赖固定自查（直接依赖必须 == 精确固定）
        run: python scripts/check_pins.py

      - name: 密钥门禁（命中即阻断）
        run: python scripts/prepublish_check.py --secrets-only

      - name: 越权红线（离线：不连库、不需要 API Key）
        run: python -m eval.security_suite

      - name: 单元 / 集成回归
        run: python -m pytest -q

  mysql-types:
    # 固定在 3.12 单一版本：这个任务的价值是"真 MySQL 的类型/DDL 盲区"，
    # 与解释器版本的组合无关，矩阵化只会白烧两倍 MySQL 时间。
    #
    # 为什么单独这一个任务：CI 主门禁用 sqlite 快照（快、无需服务），但 sqlite
    # **没有 Decimal、也不是 MySQL 方言** —— 恰好是"类型类缺陷"的盲区。
    # 实测代价：金额列（Decimal）让 SSE 序列化中途崩掉、上游只看到"边车不可达"，
    # 而 CI 一直是绿的。这里起一个空 MySQL + 最小 fixture，把那些用例真正跑起来。
    name: MySQL 类型/DDL 子集（sqlite 下会被跳过的用例）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: tb_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uci -pci"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_BACKEND: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: tb_ci
      DB_USER: ci
      DB_PASSWORD: ci
      # 这些用例会真写库；库名必须指向本次的 CI 空库（不是本地的 treatbord_test）
      TEST_DB_NAME: tb_ci
      AUDIT_ENABLED: "true"
      SESSION_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 建表（ai_* 真实 DDL + 最小业务 fixture）
        run: |
          mysql -h127.0.0.1 -uci -pci tb_ci < sql/ai_tables.sql
          # 当前 schema = V9 + V10（V10 给 ai_feedback 加 updated_at，满意度报表要用）
          mysql -h127.0.0.1 -uci -pci tb_ci < sql/ai_feedback_updated_at.sql
          mysql -h127.0.0.1 -uci -pci tb_ci < sql/test_fixture.sql
          echo "--- 已建表 ---"
          mysql -h127.0.0.1 -uci -pci tb_ci -e "SHOW TABLES"

      - name: MySQL 专属子集（本地 sqlite 跑时会被跳过的那些）
        # 只选 fixture 能满足的文件；test_eval_baseline 需要**完整业务库**，
        # 由开发者在本机（连真实 MySQL）验证，见 docs/开发环境.md
        run: |
          python -m pytest tests/test_audit.py tests/test_session.py \
            tests/test_cost_report.py tests/test_sidecar_sessions.py \
            tests/test_jsonable.py -q
